{% macro external_link_icon() %}
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
    <polyline points="15 3 21 3 21 9"></polyline>
    <line x1="10" y1="14" x2="21" y2="3"></line>
</svg>
{% endmacro %}

{% macro entry_card(entry, show_status=False) %}
<div class="entry"
     data-description="{{ entry.description or '' }}"
     data-github="{{ entry.github_url or '' }}"
     data-youtube="{{ entry.youtube_url or '' }}"
     data-webpage="{{ entry.webpage_url or '' }}">
    <span>{{ entry.title }}</span>
    {% if show_status and entry.status %}<span class="dot {{ entry.status.value }}"></span>{% endif %}
</div>
{% endmacro %}
